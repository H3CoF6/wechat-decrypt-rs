name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build for Windows
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install OpenSSL
      run: choco install openssl

    - name: Set OpenSSL Environment Variables
      shell: bash
      run: |
        echo "OPENSSL_DIR=C:/Progra~1/OpenSSL" >> $GITHUB_ENV
        echo "OPENSSL_INCLUDE_DIR=C:/Progra~1/OpenSSL/include" >> $GITHUB_ENV
        echo "OPENSSL_LIB_DIR=C:/Progra~1/OpenSSL/lib" >> $GITHUB_ENV
        echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
        
        echo "RUSTFLAGS=-L native=C:/Progra~1/OpenSSL/lib" >> $GITHUB_ENV
        
        echo "C:/Progra~1/OpenSSL/bin" >> $GITHUB_PATH
    
    - name: Build Release
      run: cargo build --release --target x86_64-pc-windows-msvc
    
    - name: Package
      shell: bash
      run: |
        mkdir -p dist
        cp target/x86_64-pc-windows-msvc/release/wx-dump-rs.exe dist/
        cp target/x86_64-pc-windows-msvc/release/wx_dump.dll dist/
        cd dist
        7z a ../wx-dump-rs-${{ github.ref_name }}-windows-x64.zip wx-dump-rs.exe wx_dump.dll
    
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: wx-dump-rs-*.zip
        body: |
          ## 📦 Release ${{ github.ref_name }}
          
          Automated release for **wx-dump-rs**.
          
          ### 🛠 Changes
          - Build from commit: `${{ github.sha }}`
          - Architecture: `x86_64-pc-windows-msvc`
          
          ### 📥 Download
          Check assets below for the compiled binary.
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
