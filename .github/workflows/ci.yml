name: Rust CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  pull-requests: write
  contents: read

jobs:
  build:
    name: Build & Test (Windows)
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2

    - name: Install OpenSSL
      run: choco install openssl

    - name: Set OpenSSL Environment Variables
      shell: bash
      run: |
        echo "OPENSSL_DIR=C:/Progra~1/OpenSSL" >> $GITHUB_ENV
        echo "OPENSSL_INCLUDE_DIR=C:/Progra~1/OpenSSL/include" >> $GITHUB_ENV
        echo "OPENSSL_LIB_DIR=C:/Progra~1/OpenSSL/lib" >> $GITHUB_ENV
        echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
        
        echo "RUSTFLAGS=-L native=C:/Progra~1/OpenSSL/lib" >> $GITHUB_ENV
        
        echo "C:/Progra~1/OpenSSL/bin" >> $GITHUB_PATH
    
    - name: Run Clippy
      run: cargo clippy -- -D warnings

    - name: Build
      run: cargo build --verbose

    - name: Test
      run: cargo test --verbose

    - name: Generate Report
      if: always()
      id: report
      shell: bash
      run: |
        # Use shell to generate a nice report
        status="${{ job.status }}"
        emoji="✅"
        [ "$status" != "success" ] && emoji="❌"
        
        echo "## 🚀 CI Build & Test Summary" >> $GITHUB_STEP_SUMMARY
        echo "| Step | Result |" >> $GITHUB_STEP_SUMMARY
        echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
        echo "| **Job Status** | $emoji **${status^^}** |" >> $GITHUB_STEP_SUMMARY
        echo "| **Run ID** | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check full logs in [GitHub Actions Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

    - name: Comment PR
      if: github.event_name == 'pull_request' && always()
      uses: actions/github-script@v7
      with:
        script: |
          const status = '${{ job.status }}' === 'success' ? '✅' : '❌';
          const body = `### 🚀 CI Build Status: ${status}
          
          | Job | Result |
          | :--- | :--- |
          | **Build & Test** | ${status} |
          
          [View detailed logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          
          *Generated by GitHub Actions Bot*`;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          })
