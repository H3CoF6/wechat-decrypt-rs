[package]
name = "wx-dump-rs"
version = "1.0.3"
edition = "2021"
authors = ["H3CoF6"]
description = "A lightweight and fast WeChat Database & Media Decryptor written in Rust"
license = "MIT"
repository = "https://github.com/H3CoF6/wechat-decrypt-rs"

[lib]
name = "wx_dump"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "wx-dump-rs"
path = "src/main.rs"

[dependencies]
cliclack = "0.3"
anyhow = "1.0"
console = "0.15"
indicatif = "0.17"
rayon = "1.8"
jwalk = "0.8"
hex = "0.4"
memchr = "2.7"
aes = "0.8"
cbc = "0.1"
cfb-mode = "0.8"
cipher = "0.4"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
pbkdf2 = "0.12"
md-5 = "0.10"
tabled = "0.15"
infer = "0.16"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
rusqlite = { version = "0.31.0", features = ["bundled-sqlcipher"] }

[dependencies.windows]
version = "0.52"
features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
]

[profile.release]
opt-level = 3
lto = "fat"       
codegen-units = 1  
panic = "abort"   
strip = true  
